; Knob 固件：ESP32-S3 + GC9A01 + EC11 + 自定义 BLE GATT（不走 HID）
; 方案见 docs/旋钮-最小硬件调试方案.md、docs/蓝牙控制配件-方案.md
; https://docs.platformio.org/page/projectconf.html
;
; 同一套代码跑两块硬件：自制 PCB（pcb）和 ESP32-S3 DevKitC 开发板（devkit）。
; 两块板子引脚不同，靠 build_flags 里的 BOARD_PCB / BOARD_DEVKIT 宏在
; include/config.h 里选一组引脚；每个程序（主程序 + 3 个分阶段测试）
; 各有 pcb、devkit 两个 env，env 名后缀就是板子。

[platformio]
; 不带 -e 的 pio run 只编自制 PCB 主程序，不会把 8 个 env 全编一遍。
default_envs = pcb

; 所有 env 共用的部分（PlatformIO 会自动把 [env] 合进每个 [env:xxx]）。
[env]
; PlatformIO 官方 espressif32 仓库多年一直卡在 Arduino-ESP32 2.0.x
; （对应很老的 ESP-IDF 4.4），2025-05 那个 ESP32-S3 蓝牙控制器配对 bug
; 修复没有回合并到这条老分支。换成社区维护的 pioarduino fork，跟得上
; 新版本（这次锁定 v3.3.11，基于 ESP-IDF v5.5.5，明显晚于那个修复合并
; 的时间）——Arduino API 完全兼容，不用改任何现有代码。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; 自制 PCB 用的 WROOM-1 模块跟开发板是同一颗芯片，共用这个板型定义。
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 构建前生成固件版本号（FW_VERSION），规则见脚本开头的注释。
extra_scripts = pre:scripts/version.py
lib_deps =
	; 1.2.1 直接戳 ESP-IDF 4.4 时代的 GPIO 寄存器结构体，在新工具链的
	; ESP-IDF 5.x 上编不过（GPIO.out1_w1ts.val 找不到定义）；1.6.7 改成
	; 用寄存器地址宏，不依赖那个结构体。
	moononournation/GFX Library for Arduino@1.6.7
	h2zero/NimBLE-Arduino@2.5.1
; lvgl 走 git submodule（firmware/lib/lvgl，锁定 v9.5.0），不走 lib_deps 注册表拉取。
; lv_conf.h 放在 lib/lv_conf.h（lvgl 文件夹的同级目录，LVGL 官方文档方案 1）：
; lvgl 内部用 "../../lv_conf.h" 相对路径找它，不依赖 -I 参数，
; 不会像方案 2（LV_CONF_INCLUDE_SIMPLE + include/ 目录）那样因为 PlatformIO
; 不会把项目 include/ 目录传给 lib/ 库内部源文件而找错配置。

; --- 两块板子各自的编译宏（下面的 env 用 ${board_xxx.build_flags} 引用）---
[board_pcb]
build_flags =
	-D BOARD_PCB
	-D ARDUINO_USB_MODE=0
	; 不设这个宏时默认是0, Serial 走的是传统硬件 UART0 （开发板上板载
	; 桥接芯片转出来的那个“COM 口”）。自制板子没有桥接芯片、也没有引出
	; UART0 的排针，只有原生 USB （GPIO19/20）。把这个打开之后 Serial
	; 才会走原生 USB，插板子的 USB-C 口才能看到日志。
	-D ARDUINO_USB_CDC_ON_BOOT=1

[board_devkit]
build_flags =
	-D BOARD_DEVKIT
	-D ARDUINO_USB_MODE=0
	; 开发板不开 USB CDC：Serial 走 UART0，插板载桥接芯片那个 COM 口看日志。

; --- 主程序 ---
; 自制 PCB：pio run -e pcb -t upload -t monitor
[env:pcb]
build_flags = ${board_pcb.build_flags}

; 开发板：pio run -e devkit -t upload -t monitor
[env:devkit]
build_flags = ${board_devkit.build_flags}

; --- 独立测试环境 ---
; 分阶段验证硬件用，源码在 test/ 目录，见 docs/旋钮-最小硬件调试方案.md。

; 只接屏幕、不接编码器：pio run -e test_display_pcb（或 _devkit）-t upload -t monitor
[test_display]
build_src_filter = -<*> +<../test/test_display_main.cpp>

[env:test_display_pcb]
build_flags = ${board_pcb.build_flags}
build_src_filter = ${test_display.build_src_filter}

[env:test_display_devkit]
build_flags = ${board_devkit.build_flags}
build_src_filter = ${test_display.build_src_filter}

; 只接编码器、不接屏幕：pio run -e test_encoder_pcb（或 _devkit）-t upload -t monitor
[test_encoder]
build_src_filter = -<*> +<encoder.cpp> +<../test/test_encoder_main.cpp>

[env:test_encoder_pcb]
build_flags = ${board_pcb.build_flags}
build_src_filter = ${test_encoder.build_src_filter}

[env:test_encoder_devkit]
build_flags = ${board_devkit.build_flags}
build_src_filter = ${test_encoder.build_src_filter}

; 只测 BLE，不接屏幕/编码器：pio run -e test_ble_pcb（或 _devkit）-t upload -t monitor
; 直接用 h2zero/NimBLE-Arduino 原生 API 建 GATT server + 配对，不走标准
; HID 键盘 profile——旋钮动作靠自定义特征值通知给手机，手机侧不需要
; 无障碍服务权限（车机的定制系统没有暴露标准无障碍设置入口，之前那套
; HID + 无障碍服务拦截按键的方案在车机上走不通），见 ble.h 顶部注释。
; 不用引脚，两块板子只差 Serial 走哪个口。
[test_ble]
build_src_filter = -<*> +<ble.cpp> +<../test/test_ble_main.cpp>

[env:test_ble_pcb]
build_flags = ${board_pcb.build_flags}
build_src_filter = ${test_ble.build_src_filter}

[env:test_ble_devkit]
build_flags = ${board_devkit.build_flags}
build_src_filter = ${test_ble.build_src_filter}
